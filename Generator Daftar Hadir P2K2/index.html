<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Daftar Hadir P2K2 - Auto Day</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <!-- Library SheetJS untuk membaca file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-DV25BYV3TL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-DV25BYV3TL');
</script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #d32f2f; text-align: center; margin-bottom: 25px; border-bottom: 2px solid #d32f2f; padding-bottom: 10px; }
        
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
        
        /* Box Input Excel */
        .excel-box {
            background-color: #e8f5e9;
            border: 1px dashed #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .excel-box label { color: #1b5e20; }
        .excel-info { font-size: 11px; color: #555; margin-top: 4px; }

        /* Tombol Generate / Unduh (Merah) */
        .btn-generate { 
            width: 100%; background: #d32f2f; color: white; padding: 15px; border: none; 
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; 
            margin-top: 20px; transition: 0.3s;
        }
        .btn-generate:hover { background: #b71c1c; }

        /* Tombol Print (Biru) */
        .btn-print { 
            width: 100%; background: #1976d2; color: white; padding: 15px; border: none; 
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; 
            margin-top: 10px; transition: 0.3s;
        }
        .btn-print:hover { background: #115293; }
        
        /* Highlight untuk input otomatis */
        .auto-input { background-color: #f8f9fa; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- Menambahkan elemen gambar tersembunyi untuk ditarik ke dalam PDF -->
<img id="logoPkh" src="download.jfif" style="display: none;" crossorigin="anonymous">

<div class="container">
    <h2>SISTEM DAFTAR HADIR P2K2</h2>
    
    <div class="row">
        <div class="col">
            <label>Nama Pendamping:</label>
            <input type="text" id="namaPendamping" placeholder="Masukkan Nama Lengkap">
        </div>
        <div class="col">
            <label>NIP Pendamping:</label>
            <input type="text" id="nipPendamping" placeholder="Masukkan NIP">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Nama Kelompok:</label>
            <input type="text" id="namaKelompok" placeholder="Contoh: Meral Sejahtera">
        </div>
        <div class="col">
            <label>Jumlah Baris (KPM):</label>
            <input type="number" id="jmlBaris" value="18">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Tempat Pertemuan:</label>
            <input type="text" id="tempat" placeholder="Contoh: Balai Desa">
        </div>
        <div class="col">
            <label>Pilih Tanggal:</label>
            <input type="date" id="tanggal" onchange="updateHariOtomatis()">
        </div>
        <div class="col">
            <label>Hari (Otomatis):</label>
            <input type="text" id="hariOtomatis" class="auto-input" readonly placeholder="-">
        </div>
    </div>

    <!-- Modul Upload Excel Baru -->
    <div class="excel-box">
        <label>Upload Data KPM (Excel / CSV):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
        <div class="excel-info">
            * Format Excel ideal memiliki header kolom <b>NAMA</b> dan <b>NIK</b> pada baris pertama (Kolom A & B).
        </div>
    </div>

    <!-- Dua tombol terpisah untuk Unduh dan Cetak Langsung -->
    <button onclick="generatePDF()" class="btn-generate">UNDUH PDF DAFTAR HADIR</button>
    <button onclick="printPDF()" class="btn-print">PRINT LANGSUNG</button>
</div>

<script>
    // Variable global untuk menyimpan data KPM hasil import Excel
    let dataKpmExcel = [];

    // Fungsi untuk memproses file Excel yang diunggah
    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // Ambil sheet pertama
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Konversi sheet ke JSON
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            dataKpmExcel = [];
            if (jsonData.length > 0) {
                // Deteksi apakah baris pertama berisi header nama/nik
                let startRow = 0;
                const headerCol0 = String(jsonData[0][0] || '').toLowerCase();
                const headerCol1 = String(jsonData[0][1] || '').toLowerCase();

                if (headerCol0.includes('nama') || headerCol0.includes('kpm') || headerCol1.includes('nik')) {
                    startRow = 1; // Lewati baris header
                }

                for (let i = startRow; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (row && (row[0] || row[1])) {
                        dataKpmExcel.push({
                            nama: String(row[0] || '').trim(),
                            nik: String(row[1] || '').trim()
                        });
                    }
                }

                if (dataKpmExcel.length > 0) {
                    // Otomatis update jumlah baris KPM sesuai jumlah data di Excel
                    document.getElementById('jmlBaris').value = dataKpmExcel.length;
                    alert(`Berhasil mengimpor ${dataKpmExcel.length} data KPM dari Excel.`);
                } else {
                    alert('Tidak ada data KPM yang dapat dibaca dari file Excel.');
                }
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // Fungsi untuk mendapatkan nama hari dalam Bahasa Indonesia
    function getNamaHari(dateStr) {
        if(!dateStr) return "";
        const d = new Date(dateStr);
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        return hari[d.getDay()];
    }

    // Update tampilan hari saat tanggal dipilih
    function updateHariOtomatis() {
        const tglInput = document.getElementById('tanggal').value;
        const hariField = document.getElementById('hariOtomatis');
        hariField.value = getNamaHari(tglInput);
    }

    function formatTglIndo(dateStr) {
        if(!dateStr) return "-";
        const d = new Date(dateStr);
        const bln = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
        return `${d.getDate()} ${bln[d.getMonth()]} ${d.getFullYear()}`;
    }

    // Fungsi Inti untuk merakit PDF (Digunakan oleh tombol Unduh maupun Print)
    function buildPDFDocument() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        const pendamping = document.getElementById('namaPendamping').value || "....................";
        const nip = document.getElementById('nipPendamping').value || "....................";
        const kelompok = document.getElementById('namaKelompok').value || "-";
        const jml = parseInt(document.getElementById('jmlBaris').value) || 18;
        const tempat = document.getElementById('tempat').value || "-";
        
        const tglValue = document.getElementById('tanggal').value;
        const hari = getNamaHari(tglValue) || "-";
        const tgl = formatTglIndo(tglValue);

        // --- TAMBAHAN LOGO PKH ---
        try {
            const logoPkh = document.getElementById('logoPkh');
            doc.addImage(logoPkh, 'JPEG', 15, 10, 30, 16);
        } catch (error) {
            console.warn("Gagal memuat logo: Pastikan file download.jfif berada di folder yang sama.", error);
        }
        // -------------------------

        // Header 
        doc.setFontSize(10).setFont(undefined, 'bold');
        doc.text("KEMENTERIAN SOSIAL REPUBLIK INDONESIA", 105, 15, { align: "center" });
        doc.setFontSize(12);
        doc.text("DAFTAR HADIR PERTEMUAN KELOMPOK P2K2", 105, 21, { align: "center" });
        doc.setFontSize(10).setFont(undefined, 'normal');
        doc.text("PROGRAM KELUARGA HARAPAN (PKH)", 105, 26, { align: "center" });
        doc.line(15, 28, 195, 28);

        // Info Detail dengan Titik Dua Rata
        doc.setFontSize(10);
        const startX = 15;
        const dotX = 45; 
        
        doc.text("Nama Kelompok", startX, 38); doc.text(":", dotX, 38); doc.text(kelompok, dotX + 3, 38);
        doc.text("Hari / Tanggal", startX, 44); doc.text(":", dotX, 44); doc.text(`${hari}, ${tgl}`, dotX + 3, 44);
        doc.text("Tempat", startX, 50);        doc.text(":", dotX, 50); doc.text(tempat, dotX + 3, 50);

        // Data Tabel (Menambahkan Kolom NIK setelah Nama)
        const bodyData = [];
        for (let i = 1; i <= jml; i++) {
            // Ambil data nama dan NIK dari hasil impor Excel (jika ada)
            const kpm = dataKpmExcel[i - 1] || { nama: "", nik: "" };
            
            if (i % 2 !== 0) {
                bodyData.push([i, kpm.nama, kpm.nik, `${i}. ...........`, ""]);
            } else {
                bodyData.push([i, kpm.nama, kpm.nik, "", `${i}. ...........`]);
            }
        }

        doc.autoTable({
            startY: 55,
            head: [['NO', 'NAMA KPM', 'NIK', 'TANDA TANGAN', '']],
            body: bodyData,
            theme: 'grid',
            headStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], halign: 'center' },
            columnStyles: {
                0: { cellWidth: 10, halign: 'center' },
                1: { cellWidth: 55 },
                2: { cellWidth: 40, halign: 'center' },
                3: { cellWidth: 37 },
                4: { cellWidth: 38 }
            },
            styles: { minCellHeight: 8, valign: 'middle', fontSize: 8.5 }
        });

        // Footer Tanda Tangan 
        let finalY = doc.lastAutoTable.finalY + 15;
        if (finalY > 250) { doc.addPage(); finalY = 20; }

        doc.text("ASN PPPK KEMENSOS RI", 140, finalY);
        doc.setFont(undefined, 'bold');
        doc.text(pendamping.toUpperCase(), 140, finalY + 20);
        doc.setFont(undefined, 'normal');
        doc.text(`NIP. ${nip}`, 140, finalY + 25);

        return { doc, kelompok };
    }

    // Fungsi 1: Unduh PDF
    function generatePDF() {
        const { doc, kelompok } = buildPDFDocument();
        doc.save(`Absen_P2K2_${kelompok}.pdf`);
    }

    // Fungsi 2: Print Langsung
    function printPDF() {
        const { doc } = buildPDFDocument();
        // Menambahkan perintah auto-print bawaan jsPDF
        doc.autoPrint(); 
        // Membuka PDF di tab baru menggunakan blob URL
        window.open(doc.output('bloburl'), '_blank');
    }
</script>
    <!-- Tambahkan tombol kembali -->
    <script src="../tombol-kembali.js"></script>
</body>
</html>
